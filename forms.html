<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" rel="stylesheet">

</head>
<body>


<div class="container"></div>
<div class="row">
    <div class="col-sm-4 mx-auto ">
        <form action="">

            <div class="mt-3 mb-3">
                <label class="form-label text-danger" for="first_name">FIRST NAME</label>
                <input class="form-control rounded-0"  id="first_name" type="text">
            </div>
            <div class="mt-3 mb-3">
                <label class="form-label text-danger" " for="second_name">SECOND NAME</label>
                <input class="form-control rounded-0" id="second_name" type="text">
            </div>
            <div class="mt-3 mb-3">
                <label class="form-label text-danger"" for="first_name">FIRST NAME</label>
                <input class=" form-control rounded-0" id="first_name" type="text">
            </div>
            <div class="mt-3 mb-3">
                <label class="form-label text-danger"" for="password">Password</label>
                <input class="form-control rounded-0" id="password" type="password">
            </div>
            <div class="mt-3 mb-3">
                <label class="form-label text-danger" for="edu">Education Level</label>
                <select class="form-select" id="edu" name="edu">
                    <option value="">University</option>
                    <option value="">Polytechnic</option>
                    <option value="">College</option>
                    <option value="">High School</option>
                    <option value="">Other</option>
                </select>

                <div class="form-check">
                    <input class="form-check-input" id="radio2" name="gender" type="radio" >Male
                    <label class="form-check-label" for="radio2"></label>
                </div>

                <div class="form-check">
                    <input checked class="form-check-input" id="radio1" name="gender" type="radio" >Female
                    <label class="form-check-label" ></label>
                </div>
            </div>
<button class="btn btn-dark mt-4 w-100">Register</button>


        </form>
    </div>
</div>
</body>
</html>
